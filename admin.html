<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Добавить работу — ALIEWILLEATYXU</title>
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="nav">
      <div class="wrap nav-inner">
        <a class="wordmark" href="index.html">ALIEWILLEATYXU</a>
        <nav class="nav-links" aria-label="Разделы">
          <a href="index.html#works">Работы</a>
          <a href="index.html#contact">Контакт</a>
        </nav>
      </div>
    </header>
    <main class="section">
      <div class="wrap admin">
        <p class="index">Админ</p>
        <h1 class="admin-title">Новая работа</h1>
        <p class="sub">Вход для заказчика. Добавленная запись появляется в cue sheet.</p>

        <form id="login" class="admin-card">
          <label>
            Логин
            <input name="username" autocomplete="username" required />
          </label>
          <label>
            Пароль
            <input name="password" type="password" autocomplete="current-password" required />
          </label>
          <button class="btn" type="submit">Войти</button>
          <p id="login-error" class="note" role="status"></p>
        </form>

        <section id="studio" hidden>
          <form id="add" class="admin-card">
            <label>
              Название
              <input name="title" maxlength="80" required />
            </label>
            <label>
              Формат
              <select name="cat">
                <option value="score">Саундтрек</option>
                <option value="ambient">Эмбиент</option>
                <option value="design">Удары</option>
                <option value="video">Видео</option>
              </select>
            </label>
            <label>
              Коротко о записи
              <input name="text" maxlength="280" />
            </label>
            <label>
              Файл
              <input name="file" type="file" accept="audio/*,video/*,.mp3,.wav,.ogg,.m4a,.mp4,.webm,.mov" required />
            </label>
            <button class="btn" type="submit">Добавить в сессию</button>
            <p id="add-status" class="note" role="status"></p>
          </form>
          <h2 class="admin-list-title">Добавленные</h2>
          <ul id="added" class="added"></ul>
          <button id="logout" class="btn btn-ghost" type="button">Выйти</button>
        </section>
      </div>
    </main>
    <script src="admin.js"></script>
  </body>
</html>
